name: Build Android Signed AAB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to build and sign.
        required: true
        type: string
      build_name:
        description: Optional version name override.
        required: false
        type: string
      build_number:
        description: Optional build number override.
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Git tag to build and sign.
        required: true
        type: string
      build_name:
        description: Optional version name override.
        required: false
        type: string
      build_number:
        description: Optional build number override.
        required: false
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: true
      ADMOB_SECRETS_JSON_BASE64:
        required: true

jobs:
  build-android-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Load release guard values
        run: python3 tool/release_guard.py --emit-github-env >> "$GITHUB_ENV"

      - name: Verify release guard
        run: python3 tool/release_guard.py --expected-tag "${{ inputs.release_tag }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDKs
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            else
              export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            fi
          fi
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;25.1.8937393" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "STOCKFISH_ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Firebase Android config
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          : "${FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:?Missing secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64}"

          echo "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Install Android signing assets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?Missing secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing secret ANDROID_KEY_PASSWORD}"

          KEYSTORE_PATH="$RUNNER_TEMP/chessiq-upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Install AdMob secrets.json
        env:
          ADMOB_SECRETS_JSON_BASE64: ${{ secrets.ADMOB_SECRETS_JSON_BASE64 }}
        run: |
          set -euo pipefail

          : "${ADMOB_SECRETS_JSON_BASE64:?Missing secret ADMOB_SECRETS_JSON_BASE64}"

          echo "$ADMOB_SECRETS_JSON_BASE64" | base64 --decode > secrets.json
          python3 - <<'PY'
          import json

          config = json.load(open('release_guard.json', encoding='utf-8'))
          data = json.load(open('secrets.json', encoding='utf-8'))
          required = config['required_android_admob_secret_keys']
          blank_allowed = set(config['blank_allowed_android_admob_secret_keys'])
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit('Missing AdMob secrets keys: ' + ', '.join(missing))
          blank = [key for key in required if key not in blank_allowed and not str(data.get(key, '')).strip()]
          if blank:
              raise SystemExit('Blank AdMob secrets keys: ' + ', '.join(blank))
          if data.get('ADMOB_ANDROID_APP_ID') != config['android_admob_app_id']:
              raise SystemExit('ADMOB_ANDROID_APP_ID does not match release_guard.json')
          PY

      - name: Fetch pinned Stockfish 18 source
        run: |
          set -euo pipefail
          STOCKFISH_CLONE_REF="${STOCKFISH_TAG#refs/tags/}"
          git clone --depth 1 --branch "$STOCKFISH_CLONE_REF" "$STOCKFISH_REPO" Stockfish
          git -C Stockfish checkout --detach "$STOCKFISH_COMMIT"
          test "$(git -C Stockfish rev-parse HEAD)" = "$STOCKFISH_COMMIT"

      - name: Build Stockfish Android executables
        env:
          STOCKFISH_ANDROID_NDK_ROOT: ${{ env.STOCKFISH_ANDROID_NDK_ROOT }}
        run: python3 tool/build_stockfish_android.py --source-dir Stockfish --ndk "$STOCKFISH_ANDROID_NDK_ROOT"

      - name: Build Android App Bundle
        env:
          BUILD_NAME_INPUT: ${{ inputs.build_name }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          cmd=(flutter build appbundle --release --dart-define-from-file=secrets.json)
          if [ -n "${BUILD_NAME_INPUT:-}" ]; then
            cmd+=(--build-name "$BUILD_NAME_INPUT")
          fi
          if [ -n "${BUILD_NUMBER_INPUT:-}" ]; then
            cmd+=(--build-number "$BUILD_NUMBER_INPUT")
          fi
          "${cmd[@]}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessIQ-android-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
