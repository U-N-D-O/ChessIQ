name: Build Android Emulator APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override.
        required: false
        type: string
      build_number:
        description: Optional build number override.
        required: false
        type: string

jobs:
  build-android-emulator-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load pinned build values
        run: python3 tool/release_guard.py --emit-github-env >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDKs
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
            else
              export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            fi
          fi
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "ndk;25.1.8937393" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "STOCKFISH_ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Fetch pinned Stockfish 18 source
        run: |
          set -euo pipefail
          STOCKFISH_CLONE_REF="${STOCKFISH_TAG#refs/tags/}"
          git clone --depth 1 --branch "$STOCKFISH_CLONE_REF" "$STOCKFISH_REPO" Stockfish
          git -C Stockfish checkout --detach "$STOCKFISH_COMMIT"
          test "$(git -C Stockfish rev-parse HEAD)" = "$STOCKFISH_COMMIT"

      - name: Build Stockfish Android executable for emulator
        env:
          STOCKFISH_ANDROID_NDK_ROOT: ${{ env.STOCKFISH_ANDROID_NDK_ROOT }}
        run: |
          python3 tool/build_stockfish_android.py \
            --source-dir Stockfish \
            --ndk "$STOCKFISH_ANDROID_NDK_ROOT" \
            --abis x86_64

      - name: Build Android emulator APK
        env:
          BUILD_NAME_INPUT: ${{ inputs.build_name }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          ADMOB_ANDROID_APP_ID: ca-app-pub-3940256099942544~3347511713
        run: |
          set -euo pipefail
          cmd=(
            flutter build apk
            --release
            --target-platform android-x64
            --split-per-abi
            --dart-define=ADMOB_FORCE_TEST_ADS=true
          )
          if [ -n "${BUILD_NAME_INPUT:-}" ]; then
            cmd+=(--build-name "$BUILD_NAME_INPUT")
          fi
          if [ -n "${BUILD_NUMBER_INPUT:-}" ]; then
            cmd+=(--build-number "$BUILD_NUMBER_INPUT")
          fi
          "${cmd[@]}"

      - name: Upload emulator APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessIQ-android-emulator-release-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 90